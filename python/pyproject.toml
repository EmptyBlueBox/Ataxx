[project]
name = "ataxx"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy==2.3.3",
    "onnx==1.18.0",
    "onnxruntime-gpu==1.22.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
